[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greentastic"
version = "0.1.0"
description = "Demo web shop (Flask + PostgreSQL + Redis + Elasticsearch) used as an OpenTelemetry example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "gunicorn",
    "psycopg[binary]",
    "redis",
    "elasticsearch>=9,<10",
    # OpenTelemetry SDK, OTLP exporter and automatic instrumentation of the libraries above
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-flask",
    "opentelemetry-instrumentation-psycopg",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-elasticsearch",
    "opentelemetry-resource-detector-containerid",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["greentastic*"]

[tool.setuptools.package-data]
greentastic = ["templates/*", "static/**/*", "sql/*"]
